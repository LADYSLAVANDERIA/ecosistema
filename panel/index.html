<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel · Pasta al paso</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../base.css?v=4">
<style>
body{background:var(--leche)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 24px;background:var(--albahaca);color:var(--semola)}
.top h1{margin:0;font-size:28px;flex:1}
.top input{font:inherit;padding:8px 12px;border-radius:10px;border:0}
.top button{border:2px solid var(--semola);background:transparent;color:var(--semola);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:700}
main{max-width:1100px;margin:0 auto;padding:24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{background:var(--semola);border-radius:18px;padding:18px 20px}
.kpi b{display:block;font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:40px;line-height:1.1}
.kpi span{font-size:16px;color:var(--albahaca-2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
section{background:#fff;border:2px solid #EFD9D2;border-radius:18px;padding:18px 20px}
h2{margin:0 0 12px;font-size:20px}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:8px 4px;border-bottom:1px solid #EFD9D2;text-align:left}
td.r,th.r{text-align:right}
.bars{display:flex;align-items:flex-end;gap:6px;height:160px;overflow-x:auto}
.bar{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--gris)}
.bar i{display:block;width:100%;background:var(--albahaca);border-radius:6px 6px 0 0}
.muted{color:var(--gris)}
.pinform{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pinform input{font:inherit;padding:10px;border-radius:10px;border:2px solid var(--albahaca);width:130px}
.pinform button{border:0;border-radius:999px;padding:10px 18px;background:var(--albahaca);color:var(--semola);font-weight:700;cursor:pointer}
@media (max-width:760px){.row{grid-template-columns:1fr}}
</style></head>
<body><div id="app"></div>
<script src="../api.js?v=4"></script>
<script>
const CANAL={totem:"Tótem",meson:"Mesón",whatsapp:"WhatsApp",web:"Web",pedidosya:"PedidosYa",rappi:"Rappi",ubereats:"Uber Eats"};
const app=document.getElementById("app");
let PIN=(new URLSearchParams(location.search).get("k")||localStorage.getItem("eco_pin"))||"",FECHA=new Date().toLocaleDateString("en-CA",{timeZone:"America/Santiago"}),timer;
function login(msg){app.innerHTML=`<div class="pinbox"><form id="f"><h1 class="serif">Panel del negocio</h1><input id="p" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="PIN" aria-label="PIN de 6 dígitos"><p class="err">${msg||""}</p><button>Entrar</button></form></div>`;
 document.getElementById("p").focus();document.getElementById("f").onsubmit=e=>{e.preventDefault();PIN=document.getElementById("p").value.trim();load()}}
async function load(){clearTimeout(timer);
 try{const d=await ECO.rpc("eco_panel",{p_negocio:ECO.negocio,p_pin:PIN,p_fecha:FECHA});localStorage.setItem("eco_pin",PIN);draw(d)}
 catch(e){if(/PIN/.test(e.message)){localStorage.removeItem("eco_pin");return login("PIN incorrecto")}}
 timer=setTimeout(load,30000)}
function draw(d){
 const tp=d.pedidos?Math.round(d.ventas/d.pedidos):0;
 const canales=Object.entries(d.por_canal||{}).sort((a,b)=>b[1].ventas-a[1].ventas);
 const horas=Object.entries(d.por_hora||{}).map(([h,n])=>[+h,n]).sort((a,b)=>a[0]-b[0]);const mx=Math.max(1,...horas.map(h=>h[1]));
 app.innerHTML=`<header class="top"><h1 class="serif">Panel del negocio</h1><input type="date" id="fecha" value="${FECHA}" aria-label="Fecha"><button id="out">Salir</button></header>
 <main>
  <div class="kpis">
   <div class="kpi"><b>${clp(d.ventas)}</b><span>Ventas del día</span></div>
   <div class="kpi"><b>${d.pedidos}</b><span>Pedidos</span></div>
   <div class="kpi"><b>${clp(tp)}</b><span>Ticket promedio</span></div>
   <div class="kpi"><b>${d.clientes_nuevos}</b><span>Clientes nuevos con celular</span></div>
  </div>
  <div class="row">
   <section><h2>Por canal</h2>${canales.length?`<table><tr><th>Canal</th><th class="r">Pedidos</th><th class="r">Ventas</th></tr>${canales.map(([c,v])=>`<tr><td>${CANAL[c]||c}</td><td class="r">${v.pedidos}</td><td class="r">${clp(v.ventas)}</td></tr>`).join("")}</table>`:`<p class="muted">Aún no hay ventas este día.</p>`}</section>
   <section><h2>Platos más pedidos</h2>${(d.top||[]).length?`<table>${d.top.map(t=>`<tr><td>${t.plato}</td><td class="r">${t.cantidad}</td></tr>`).join("")}</table>`:`<p class="muted">Aún no hay ventas este día.</p>`}</section>
  </div>
  <section style="margin-top:22px"><h2>Pedidos por hora</h2>${horas.length?`<div class="bars">${horas.map(([h,n])=>`<div class="bar"><span>${n}</span><i style="height:${Math.round(n/mx*120)}px"></i><span>${h}:00</span></div>`).join("")}</div>`:`<p class="muted">Aún no hay ventas este día.</p>`}</section>
  <section hidden><h2>Cambiar PIN</h2><div class="pinform"><input id="np" inputmode="numeric" maxlength="6" placeholder="Nuevo PIN" aria-label="Nuevo PIN de 6 dígitos"><button id="cp">Guardar PIN</button><span id="cpm" class="muted"></span></div><p class="muted">El mismo PIN abre la cocina y este panel.</p></section>
 </main>`;
 document.getElementById("fecha").onchange=e=>{FECHA=e.target.value;load()};
 document.getElementById("out").onclick=()=>{localStorage.removeItem("eco_pin");PIN="";clearTimeout(timer);login()};
 document.getElementById("cp").onclick=async()=>{const n=document.getElementById("np").value.trim(),m=document.getElementById("cpm");
  try{await ECO.rpc("eco_cambiar_pin",{p_negocio:ECO.negocio,p_pin:PIN,p_nuevo:n});PIN=n;localStorage.setItem("eco_pin",n);m.textContent="PIN guardado."}catch(e){m.textContent=e.message}};
}
load();
</script></body></html>
