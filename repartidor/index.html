<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reparto · Pasta al paso</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../base.css">
<style>
body{background:var(--semola)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--albahaca);color:var(--semola)}
.top h1{margin:0;font-size:22px;flex:1}
.top button{border:2px solid var(--semola);background:transparent;color:var(--semola);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700}
.gps{padding:10px 16px;font-weight:700;font-size:15px}
.gps.on{background:#DDF2E3;color:#1D5E36}.gps.off{background:var(--semola-2);color:var(--tomate)}
main{padding:12px 14px 40px;max-width:640px;margin:0 auto}
h2{font-size:18px;margin:18px 4px 8px;display:flex;justify-content:space-between}
.card{background:var(--leche);border-radius:16px;padding:14px;margin-bottom:10px;border-left:8px solid var(--albahaca)}
.card.ruta{border-left-color:var(--tomate)}.card.done{opacity:.6}
.card .h{display:flex;justify-content:space-between;align-items:baseline}
.card .n{font-family:"Young Serif",Georgia,serif;font-size:32px}
.card .dir{font-size:18px;font-weight:700;margin:6px 0}
.card .meta{color:var(--gris);font-size:15px}
.card .nota{background:var(--semola-2);border-radius:8px;padding:6px 10px;margin-top:6px;font-size:15px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts a,.acts button{display:flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:13px 8px;font-weight:800;font-size:15px;text-decoration:none;cursor:pointer;background:var(--semola-2);color:var(--albahaca)}
.acts .main{grid-column:1/-1;background:var(--albahaca);color:var(--semola);font-size:17px}
.acts .red{grid-column:1/-1;background:var(--tomate);color:#fff;font-size:17px}
.empty{color:var(--gris);padding:4px}
</style></head>
<body><div id="app"></div>
<script src="../api.js"></script>
<script>
const app=document.getElementById("app"),esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let PIN=(new URLSearchParams(location.search).get("k")||localStorage.getItem("eco_pin"))||"",YO=localStorage.getItem("eco_repartidor")||"",list=[],timer,watch=null,last=null,lastSent=0,gpsMsg="",lock=null;
function login(m){app.innerHTML=`<div class="pinbox"><form id="f"><h1 class="serif">Reparto</h1><input id="y" placeholder="Tu nombre" value="${esc(YO)}" maxlength="30" style="letter-spacing:0;font-size:22px"><input id="p" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="PIN" aria-label="PIN de 6 dígitos"><p class="err">${m||""}</p><button>Entrar</button></form></div>`;
 document.getElementById("f").onsubmit=e=>{e.preventDefault();YO=document.getElementById("y").value.trim();PIN=document.getElementById("p").value.trim();if(!YO)return login("Escribe tu nombre");localStorage.setItem("eco_repartidor",YO);load()}}
const trackUrl=t=>new URL("../seguimiento/?t="+t,location.href).href;
const mine=()=>list.filter(p=>p.estado==="en_ruta"&&p.repartidor===YO);
async function load(){clearTimeout(timer);
 try{list=await ECO.rpc("eco_reparto",{p_negocio:ECO.negocio,p_pin:PIN});localStorage.setItem("eco_pin",PIN);draw();gps()}
 catch(e){if(/PIN/.test(e.message)){localStorage.removeItem("eco_pin");return login("PIN incorrecto")}gpsMsg="Sin conexión, reintentando…"}
 timer=setTimeout(load,8000)}
function gps(){const need=mine().length>0;
 if(need&&watch===null){if(!navigator.geolocation){gpsMsg="Este teléfono no permite GPS";return}
  watch=navigator.geolocation.watchPosition(p=>{last=p.coords;gpsMsg="";send()},e=>{gpsMsg=e.code===1?"Activa el permiso de ubicación para compartir tu ruta":"Buscando señal GPS…";draw()},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>lock=l)}catch(e){}}
 if(!need&&watch!==null){navigator.geolocation.clearWatch(watch);watch=null;last=null;try{lock&&lock.release()}catch(e){}}}
async function send(force){if(!last)return;const ids=mine().map(p=>p.id);if(!ids.length)return;if(!force&&Date.now()-lastSent<12000)return;lastSent=Date.now();
 try{await ECO.rpc("eco_posicion",{p_negocio:ECO.negocio,p_pin:PIN,p_pedidos:ids,p_lat:last.latitude,p_lng:last.longitude});draw()}catch(e){}}
async function estado(id,e){try{await ECO.rpc("eco_cambiar_estado",{p_negocio:ECO.negocio,p_pin:PIN,p_pedido:id,p_estado:e,p_repartidor:YO});await load();if(e==="en_ruta")send(true)}catch(x){alert("No se pudo actualizar: "+x.message)}}
function card(p){const d=encodeURIComponent(p.direccion||"");const wa=p.telefono?`https://wa.me/${p.telefono}?text=${encodeURIComponent(`Hola ${p.nombre||""}! Tu pedido #${p.numero} va en camino 🛵 Síguelo en vivo: ${trackUrl(p.token)}`)}`:"";
 return `<article class="card ${p.estado==="en_ruta"?"ruta":p.estado==="entregado"?"done":""}"><div class="h"><span class="n">${p.numero}</span><span class="meta">${esc(p.nombre)} · ${clp(p.total)}</span></div>
 <div class="dir">${esc(p.direccion)}</div>${p.repartidor&&p.estado==="en_ruta"?`<div class="meta">En ruta con ${esc(p.repartidor)}</div>`:""}${p.nota?`<div class="nota">${esc(p.nota)}</div>`:""}
 ${p.estado==="entregado"?"":`<div class="acts">
  ${p.estado==="listo"?`<button class="main" data-e="en_ruta" data-id="${p.id}">Salir a ruta</button>`:""}
  ${p.estado==="en_ruta"&&p.repartidor===YO?`<button class="red" data-e="entregado" data-id="${p.id}">Entregado</button>`:""}
  <a href="https://www.google.com/maps/dir/?api=1&destination=${d}" target="_blank" rel="noopener">Google Maps</a>
  <a href="https://waze.com/ul?q=${d}&navigate=yes" target="_blank" rel="noopener">Waze</a>
  ${p.telefono?`<a href="tel:+${p.telefono}">Llamar</a>`:""}${wa?`<a href="${wa}" target="_blank" rel="noopener">WhatsApp</a>`:""}
 </div>`}</article>`}
function draw(){const g={listo:[],en_ruta:[],prep:[],entregado:[]};list.forEach(p=>{(p.estado==="recibido"||p.estado==="en_cocina"?g.prep:g[p.estado]).push(p)});
 const sharing=watch!==null&&last;const m=mine().length;
 app.innerHTML=`<header class="top"><h1 class="serif">Reparto · ${esc(YO)}</h1><button id="out">Salir</button></header>
 ${m?`<div class="gps ${sharing&&!gpsMsg?"on":"off"}">${gpsMsg||(sharing?`Compartiendo ubicación con ${m} cliente${m>1?"s":""}. Mantén esta pantalla abierta.`:"Activando GPS…")}</div>`:""}
 <main>
  <h2><span>En ruta</span><span>${g.en_ruta.length}</span></h2>${g.en_ruta.map(card).join("")||`<p class="empty">Nadie en ruta.</p>`}
  <h2><span>Listos para salir</span><span>${g.listo.length}</span></h2>${g.listo.map(card).join("")||`<p class="empty">Sin pedidos listos.</p>`}
  <h2><span>En cocina</span><span>${g.prep.length}</span></h2>${g.prep.map(p=>`<article class="card"><div class="h"><span class="n">${p.numero}</span><span class="meta">${esc(p.nombre)}</span></div><div class="meta">${esc(p.direccion)}</div></article>`).join("")||`<p class="empty">Nada en preparación.</p>`}
  ${g.entregado.length?`<h2><span>Entregados (30 min)</span><span>${g.entregado.length}</span></h2>${g.entregado.map(card).join("")}`:""}
 </main>`;
 document.getElementById("out").onclick=()=>{localStorage.removeItem("eco_pin");PIN="";clearTimeout(timer);login()};
 app.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{if(b.dataset.e==="entregado"&&!confirm("¿Confirmas que entregaste el pedido?"))return;b.disabled=true;estado(b.dataset.id,b.dataset.e)});
}
setInterval(()=>send(),15000);
PIN&&YO?load():login();
</script></body></html>
